<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>upShareMP4</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        html, body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; width: 100%; overflow-x: hidden; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        
        .container { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: 60px; max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #ff8c00; font-size: 2.5rem; margin-bottom: 5px; cursor: pointer; transition: opacity 0.2s; }
        h1:hover { opacity: 0.8; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        
        #login-screen { display: none; max-width: 400px; margin: 100px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border-top: 3px solid #00E676; text-align: center; }
        #login-screen form { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 0 15px; margin: 0; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; height: 48px; box-sizing: border-box; }
        
        #app-screen { display: none; }
        .controls { width: 100%; background: #1e1e1e; padding: 20px; border-radius: 8px; border-top: 3px solid #ff8c00; margin-bottom: 40px; border: 2px dashed transparent; transition: border 0.3s; }
        .controls.dragover { border: 2px dashed #00E676; background: #232323; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        @media (min-width: 600px) { .input-group { flex-direction: row; align-items: stretch; } }
        
        .btn-submit { background-color: #ff8c00; color: #fff; padding: 0 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; min-width: 120px; font-size: 16px; height: 48px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
        @media (min-width: 600px) { .controls .btn-submit { margin: 0; width: auto; } }
        .btn-submit:hover { opacity: 0.8; }
        .divider { text-align: center; color: #555; margin: 15px 0; font-weight: bold; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .card { position: relative; background-color: #1e1e1e; border-left: 5px solid #00E676; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; transition: border-left-color 0.2s; }
        .card.viewed { border-left-color: #555 !important; }
        .card.deleting { border-left-color: #ff3333 !important; }

        .card-content { flex-grow: 1; display: flex; flex-direction: column; }
        .thumbnail-wrapper { position: relative; width: 100%; height: 180px; margin-bottom: 10px; border-radius: 4px; overflow: hidden; background: #2a2a2a; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #555; text-align: center; padding: 10px;}
        .date-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }

        .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        .favicon { width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: 2px; flex-shrink: 0;}
        .video-title { font-size: 1.05rem; font-weight: bold; word-wrap: break-word; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .card-bottom { margin-top: auto; }
        .meta-tags { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin-bottom: 12px; font-size: 0.8rem; color: #aaa; scrollbar-width: none; }
        .meta-tags::-webkit-scrollbar { display: none; }
        .meta-tag { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; white-space: nowrap; }

        .btn-group { display: flex; flex-wrap: nowrap; gap: 8px; }
        .btn { flex: 1; padding: 10px 5px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn:hover { opacity: 0.8; }
        .btn-copy { background-color: transparent; border: 1px solid #ff8c00; color: #ff8c00; }
        .btn-view { background-color: #00E676; color: #121212; }
        .btn-download { background-color: #333; color: #fff; font-size: 1.1rem; flex: 0 0 50px; }
        .btn-delete { background-color: #ff3333; color: #fff; flex: 0 0 45px; font-size: 1.2rem; }

        /* Full Black Modal for Video */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: #000000; align-items: center; justify-content: center; }
        .modal-content { position: relative; width: 100%; max-width: 1000px; display: flex; flex-direction: column; }
        .modal-content video { width: 100%; max-height: 85vh; outline: none; background: #000; pointer-events: auto; }
        .close-modal { position: absolute; top: -40px; right: 10px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }
        
        .dialog-bg { background-color: rgba(0,0,0,0.95); } /* Settings dialogs keep transparency */
        .dialog-box { background: #1e1e1e; padding: 25px; border-radius: 8px; text-align: center; max-width: 400px; width: 90%; border-top: 3px solid #ff3333; margin: 0 auto;}
        .dialog-stats { border-top: 3px solid #00E676; text-align: left;}
        .dialog-stats p { margin: 10px 0; color: #ccc;}
        .dialog-stats strong { color: #fff; }
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab { cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { color: #00E676; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #00E676; color: #121212; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 80px; font-weight: bold; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }
        
        #active-tasks { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="app-title" onclick="openStats()">upShareMP4</h1>
        <p class="subtitle">Download, Convert, & Share .mp4s</p>

        <div id="login-screen">
            <h3 style="margin-top:0;">Authentication</h3>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>

        <div id="app-screen">
            <div class="controls" id="drop-zone">
                <form onsubmit="submitUrl(event)" class="input-group">
                    <input type="text" id="videoUrl" placeholder="Paste media link here..." required>
                    <button type="submit" class="btn-submit">Fetch</button>
                </form>
                <div class="divider">OR DRAG & DROP / BROWSE</div>
                <form onsubmit="uploadFile(event)" class="input-group">
                    <input type="file" id="localFile" accept="video/*" required>
                    <button type="submit" class="btn-submit">Upload</button>
                </form>
            </div>
            
            <div class="video-grid" id="active-tasks"></div>
            <div class="video-grid" id="videoGrid"></div>
        </div>
    </div>

    <div id="toast">Copied!</div>

    <div id="videoModal" class="modal" onclick="closeVideoModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeVideoModal(event)">&times;</span>
            <video id="modalVideo" controls playsinline></video>
        </div>
    </div>

    <div id="statsModal" class="modal dialog-bg" onclick="closeStatsModal(event)">
        <div class="dialog-box dialog-stats">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('stats')">Statistics</div>
                <div class="tab" onclick="switchTab('settings')">Settings</div>
            </div>
            
            <div id="tab-stats">
                <div id="statsContent">Loading...</div>
                <button class="btn" style="background:#ff3333; color:#fff; width:100%; margin-top:20px;" onclick="logoutApp()">Logout</button>
            </div>
            
            <div id="tab-settings" style="display:none;">
                <h4 style="margin:0 0 10px 0;">Account Settings</h4>
                <input type="password" id="newPass" placeholder="New Password" style="margin-bottom:10px;">
                <button class="btn" style="background:#ff8c00; color:#fff; width:100%;" onclick="changePass()">Update Password</button>
                <div id="admin-settings" style="display:none; margin-top:20px; border-top:1px solid #333; padding-top:10px;">
                    <h4 style="margin:0 0 10px 0; color:#ff8c00;">Admin Panel</h4>
                    <p style="font-size:0.8rem; color:#aaa;">Manage users via CLI: <br><code>docker exec upShareMP4 python -c "import main; main.reset_password('user', 'pass')"</code></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let loginContactMsg = "";

        // Fetch Env on load for login contact message
        fetch('/api/env').then(r => r.json()).then(d => { loginContactMsg = d.login_msg; });

        document.getElementById('app-title').addEventListener('click', () => {
            if (document.getElementById('login-screen').style.display === 'block' && loginContactMsg) {
                alert(loginContactMsg);
            } else if (currentUser) {
                openStats();
            }
        });

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // --- AUTH ---
        async function checkAuthAndLoad() {
            try {
                const res = await fetch('/api/videos');
                if (res.status === 401) {
                    document.getElementById('login-screen').style.display = 'block';
                    document.getElementById('app-screen').style.display = 'none';
                    return false;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                const data = await res.json();
                renderVideos(data.videos);
                setupSSE();
                return true;
            } catch (e) {}
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            
            const response = await fetch('/api/login', { method: 'POST', body: formData });
            if (response.ok) {
                currentUser = document.getElementById('username').value;
                document.getElementById('password').value = '';
                checkAuthAndLoad();
            } else { alert("Invalid Credentials"); }
        }

        async function logoutApp() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        // --- DRAG & DROP ---
        const dropZone = document.getElementById('drop-zone');
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); dropZone.classList.remove('dragover');
            if(e.dataTransfer.files.length) {
                document.getElementById('localFile').files = e.dataTransfer.files;
                uploadFile(new Event('submit'));
            }
        });

        // --- DATA INGESTION ---
        async function submitUrl(e, force = false) {
            if(e) e.preventDefault();
            const urlInput = document.getElementById('videoUrl');
            const formData = new FormData();
            formData.append('url', urlInput.value);
            if (force) formData.append('confirm_override', 'true');
            
            const res = await fetch('/api/download_form', { method: 'POST', body: formData });
            const result = await res.json();
            
            if (result.status === "needs_confirmation") {
                if(confirm(`File is large (${result.size_mb}MB). Proceed with download?`)) { submitUrl(null, true); }
            } else { urlInput.value = ''; }
        }

        async function uploadFile(e) {
            e.preventDefault();
            const fileInput = document.getElementById('localFile');
            if (!fileInput.files.length) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            await fetch('/api/upload', { method: 'POST', body: formData });
            fileInput.value = '';
        }

        function triggerDelete(videoId, btnElement) {
            if(confirm("Permanently delete this video?")) {
                fetch('/api/videos/' + videoId, { method: 'DELETE' }).then(() => {
                    btnElement.closest('.card').remove();
                });
            }
        }

        // --- SSE & UI UPDATES ---
        function setupSSE() {
            const evtSource = new EventSource("/api/sse");
            evtSource.onmessage = function(event) {
                const tasks = JSON.parse(event.data);
                const container = document.getElementById('active-tasks');
                container.innerHTML = '';
                for (const [id, msg] of Object.entries(tasks)) {
                    container.innerHTML += `
                        <div class="card" style="border-left-color: #ff8c00;">
                            <div class="card-content">
                                <div class="thumbnail-wrapper" style="border: 1px dashed #ff8c00;"><div class="thumbnail">${msg}</div></div>
                                <div class="card-header"><div class="video-title" style="color:#888;">Working...</div></div>
                            </div>
                        </div>`;
                }
            };
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = ''; // Full refresh for simplicity
            videos.forEach(video => {
                const videoUrl = window.location.origin + '/videos/' + video.filename;
                const thumbImg = video.thumbnail ? `<img src="/videos/${video.thumbnail}" class="thumbnail">` : `<div class="thumbnail">No Thumb</div>`;
                const faviconUrl = video.domain !== 'unknown' ? `https://www.google.com/s2/favicons?domain=${video.domain}&sz=32` : '';
                const faviconImg = faviconUrl ? `<img src="${faviconUrl}" class="favicon" onerror="this.style.display='none'">` : '';

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-content">
                            <div class="thumbnail-wrapper">
                                ${thumbImg}
                            </div>
                            <div class="card-header">
                                ${faviconImg}
                                <div class="video-title">${video.title}</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <div class="meta-tags">
                                <div class="meta-tag">👁️ ${video.views}</div>
                                <div class="meta-tag">⏱️ ${video.duration}</div>
                                <div class="meta-tag">💾 ${formatBytes(video.size_bytes)}</div>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-copy" onclick="copyLink('${videoUrl}')">Copy</button>
                                <button class="btn btn-view" onclick="openVideoModal('${videoUrl}')">View</button>
                                <a href="${videoUrl}" download="${video.filename}" class="btn btn-download">📥</a>
                                <button class="btn btn-delete" onclick="triggerDelete('${video.id}', this)">✖</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- SETTINGS & MODALS ---
        async function openStats() {
            const res = await fetch('/api/stats');
            if (res.ok) {
                const s = await res.json();
                currentUserRole = s.role;
                document.getElementById('statsContent').innerHTML = `
                    <h3 style="margin-top:0;">${s.role === 'admin' ? 'Server Statistics' : 'Your Statistics'}</h3>
                    <p>Live Videos: <strong>${s.video_count}</strong></p>
                    <p>Used Disk Space: <strong>${formatBytes(s.used_disk)}</strong></p>
                    ${s.role === 'admin' ? `<p>Bandwidth Served: <strong>${formatBytes(s.bandwidth)}</strong></p>` : ''}
                `;
                document.getElementById('admin-settings').style.display = s.role === 'admin' ? 'block' : 'none';
                document.getElementById('statsModal').style.display = 'flex';
                switchTab('stats');
            }
        }
        
        function switchTab(tab) {
            document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
            document.getElementById('tab-settings').style.display = tab === 'settings' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function changePass() {
            const np = document.getElementById('newPass').value;
            if(!np) return alert("Password cannot be empty.");
            const fd = new FormData(); fd.append("password", np);
            const res = await fetch(`/api/users/${currentUser}/password`, {method: 'POST', body: fd});
            if(res.ok) { alert("Password updated."); document.getElementById('newPass').value = ''; }
        }

        function closeStatsModal(e) { if(e.target.id === 'statsModal') e.target.style.display = 'none'; }
        
        function openVideoModal(url) {
            document.body.style.overflow = 'hidden'; 
            const m = document.getElementById('videoModal');
            const v = document.getElementById('modalVideo');
            v.src = url; m.style.display = 'flex'; v.play();
        }

        function closeVideoModal(e = null) {
            if (!e || e.target.id === 'videoModal' || e.target.className === 'close-modal') {
                document.body.style.overflow = '';
                const m = document.getElementById('videoModal');
                const v = document.getElementById('modalVideo');
                v.pause(); v.src = ''; m.style.display = 'none';
            }
        }

        function copyLink(text) {
            navigator.clipboard.writeText(text).then(() => {
                const t = document.getElementById("toast"); t.className = "show";
                setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
            });
        }

        setInterval(() => { if (document.getElementById('app-screen').style.display === 'block') checkAuthAndLoad(); }, 5000);
        window.onload = checkAuthAndLoad;
    </script>
</body>
</html>
