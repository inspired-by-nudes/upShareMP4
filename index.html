<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>upShareMP4</title>
    <!-- Mapped directly to the vector file for browser title bar -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <style>
        html, body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; width: 100%; overflow-x: hidden; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        
        .container { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: 60px; max-width: 1200px; margin: 0 auto; }
        h1 { text-align: center; color: #ff8c00; font-size: 2.5rem; margin-bottom: 5px; cursor: pointer; transition: opacity 0.2s; }
        h1:hover { opacity: 0.8; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        
        #login-screen { display: none; max-width: 400px; margin: 100px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border-top: 3px solid #00E676; text-align: center; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 0 15px; margin-bottom: 0; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; height: 48px; box-sizing: border-box; }
        
        #app-screen { display: none; }
        .controls { width: 100%; background: #1e1e1e; padding: 20px; border-radius: 8px; border-top: 3px solid #ff8c00; margin-bottom: 40px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        @media (min-width: 600px) { .input-group { flex-direction: row; align-items: stretch; } }
        
        .btn-submit { background-color: #ff8c00; color: #fff; padding: 0 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; height: 48px; display: flex; align-items: center; justify-content: center; box-sizing: border-box; margin: 0; }
        @media (min-width: 600px) { .btn-submit { width: auto; } }
        .btn-submit:hover { opacity: 0.8; }
        .divider { text-align: center; color: #555; margin: 15px 0; font-weight: bold; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .card { position: relative; background-color: #1e1e1e; border-left: 5px solid #00E676; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; transition: border-left-color 0.2s ease-in-out; }
        .card.viewed { border-left-color: #555 !important; }
        .card.hover-delete { border-left-color: #ff3333 !important; }
        .card.deleting { border-left-color: #ff3333 !important; }

        .card-content { flex-grow: 1; display: flex; flex-direction: column; }
        .thumbnail-wrapper { position: relative; width: 100%; height: 180px; margin-bottom: 10px; border-radius: 4px; overflow: hidden; background: #2a2a2a; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #555; }
        .date-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 4px 8px; font-size: 0.75rem; border-radius: 4px; }

        .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        .favicon { width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: 2px; flex-shrink: 0; transition: transform 0.2s;}
        .favicon:hover { transform: scale(1.2); }
        .video-title { font-size: 1.05rem; font-weight: bold; word-wrap: break-word; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: pointer; transition: color 0.2s; }
        .video-title:hover { color: #ff8c00; }

        /* Anchors the stats and buttons to the bottom regardless of title height */
        .card-bottom { margin-top: auto; }

        .meta-tags { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; margin-bottom: 12px; font-size: 0.8rem; color: #aaa; scrollbar-width: none; }
        .meta-tags::-webkit-scrollbar { display: none; }
        .meta-tag { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }

        .btn-group { display: flex; flex-wrap: nowrap; gap: 8px; }
        .btn { flex: 1; padding: 10px 5px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 0.9rem; text-decoration: none; display: flex; align-items: center; justify-content: center; min-width: 0; }
        .btn:hover { opacity: 0.8; }
        .btn-copy { background-color: transparent; border: 1px solid #ff8c00; color: #ff8c00; }
        .btn-view { background-color: #00E676; color: #121212; }
        .btn-download { background-color: #333; color: #fff; font-size: 1.1rem; flex: 0 0 50px; }
        .btn-delete { background-color: #ff3333; color: #fff; flex: 0 0 45px; font-size: 1.2rem; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .modal-content { position: relative; width: 90%; max-width: 1000px; display: flex; flex-direction: column; }
        .modal-content video { width: 100%; max-height: 85vh; border-radius: 8px; outline: none; background: #000; }
        .close-modal { position: absolute; top: -40px; right: 0; color: white; font-size: 35px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-modal:hover { color: #ff8c00; }
        
        .dialog-box { background: #1e1e1e; padding: 25px; border-radius: 8px; text-align: center; max-width: 400px; width: 100%; border-top: 3px solid #ff3333; }
        .dialog-box h3 { margin-top: 0; color: #fff; }
        .dialog-stats { border-top: 3px solid #00E676; text-align: left;}
        .dialog-stats p { margin: 10px 0; color: #ccc;}
        .dialog-stats strong { color: #fff; }

        #toast { visibility: hidden; min-width: 250px; background-color: #00E676; color: #121212; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 80px; font-weight: bold; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
        #toast.show { visibility: visible; opacity: 1; bottom: 40px; }

        #backToTop { display: none; position: fixed; bottom: 20px; right: 20px; z-index: 99; background: #ff8c00; color: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: opacity 0.2s; }
        #backToTop:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Clicking the Title now opens the statistics modal -->
        <h1 onclick="openStats()" title="View Server Statistics">upShareMP4</h1>
        <p class="subtitle">Download, Convert, & Share .mp4s</p>

        <div id="login-screen">
            <h3 style="margin-top:0;">Authentication Required</h3>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>

        <div id="app-screen">
            <div class="controls">
                <form onsubmit="submitUrl(event)" class="input-group">
                    <input type="text" id="videoUrl" placeholder="Paste media link here..." required>
                    <button type="submit" class="btn-submit">Fetch Video</button>
                </form>
                <div class="divider">OR</div>
                <form onsubmit="uploadFile(event)" class="input-group">
                    <input type="file" id="localFile" accept="video/*" required>
                    <button type="submit" class="btn-submit">Upload & Convert</button>
                </form>
            </div>
            <div class="video-grid" id="videoGrid"></div>
        </div>
    </div>

    <!-- Floating Back to Top Button -->
    <button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>

    <div id="toast">Copied to clipboard!</div>

    <div id="videoModal" class="modal" onclick="closeVideoModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeVideoModal(event)">&times;</span>
            <video id="modalVideo" controls playsinline></video>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="dialog-box">
            <h3>Confirm Deletion</h3>
            <p style="color:#aaa; margin-bottom:20px;">Permanently delete this video from the server?</p>
            <div class="btn-group">
                <button class="btn" style="background:#333; color:#fff;" onclick="cancelDelete()">Cancel</button>
                <button class="btn" style="background:#ff3333; color:#fff;" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <div id="statsModal" class="modal" onclick="closeStatsModal(event)">
        <div class="dialog-box dialog-stats">
            <div id="statsContent"></div>
            <!-- Logout appended directly into the stats menu -->
            <button class="btn" style="background:#ff3333; color:#fff; width:100%; margin-top:20px;" onclick="logoutApp()">Logout</button>
        </div>
    </div>

    <script>
        let pendingDeleteId = null;
        let pendingDeleteCard = null;
        window.pendingOverridePassword = null;

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024, dm = decimals < 0 ? 0 : decimals, sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            return new Date(timestamp * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTop');
            if(window.scrollY > 400) btn.style.display = 'block';
            else btn.style.display = 'none';
        });

        async function checkAuthAndLoad() {
            try {
                const response = await fetch('/api/videos');
                if (response.status === 401) {
                    document.getElementById('login-screen').style.display = 'block';
                    document.getElementById('app-screen').style.display = 'none';
                    return false;
                }
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                
                const data = await response.json();
                renderVideos(data.videos);
                return true;
            } catch (e) { console.error(e); }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);
            
            const response = await fetch('/api/login', { method: 'POST', body: formData });
            if (response.ok) {
                document.getElementById('password').value = '';
                checkAuthAndLoad();
            } else {
                alert("Invalid Credentials");
            }
        }

        async function logoutApp() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        async function promptSourceUrl(videoId) {
            const url = prompt("Enter the original source link for this video:");
            if (url) {
                await fetch(`/api/videos/${videoId}/url`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: url })
                });
                checkAuthAndLoad();
            }
        }

        async function editTitle(videoId, currentTitle) {
            const newTitle = prompt("Edit video title:", currentTitle);
            if (newTitle && newTitle !== currentTitle) {
                await fetch(`/api/videos/${videoId}/title`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: newTitle })
                });
                checkAuthAndLoad();
            }
        }

        function renderVideos(videos) {
            const grid = document.getElementById('videoGrid');
            const existingCards = Array.from(grid.querySelectorAll('.card')).map(c => c.dataset.video);
            let newItemsAdded = false;

            [...videos].reverse().forEach(video => {
                if (!existingCards.includes(video.id)) {
                    const videoUrl = window.location.origin + '/videos/' + video.filename;
                    const thumbImg = video.thumbnail ? `<img src="/videos/${video.thumbnail}" class="thumbnail">` : `<div class="thumbnail">Processing...</div>`;
                    
                    let faviconImg = '';
                    if (video.domain === 'localhost') {
                        faviconImg = `<div class="favicon" style="display:flex; align-items:center; justify-content:center; background:#ff8c00; color:#121212; cursor:pointer; font-size:12px; font-weight:bold; text-decoration:none;" onclick="promptSourceUrl('${video.id}')" title="Add Source Link">🔗</div>`;
                    } else {
                        const faviconUrl = video.domain !== 'unknown' ? `https://www.google.com/s2/favicons?domain=${video.domain}&sz=32` : '';
                        const originalUrl = video.original_url || '#';
                        faviconImg = faviconUrl ? `<a href="${originalUrl}" target="_blank" title="Go to source"><img src="${faviconUrl}" class="favicon" onerror="this.style.display='none'"></a>` : '';
                    }

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.dataset.video = video.id;
                    card.innerHTML = `
                        <div class="card-content">
                            <div class="thumbnail-wrapper">
                                ${thumbImg}
                                <div class="date-badge">${formatDate(video.date)}</div>
                            </div>
                            <div class="card-header">
                                ${faviconImg}
                                <div class="video-title" title="Double click to edit" ondblclick="editTitle('${video.id}', '${video.title.replace(/'/g, "\\'")}')">${video.title}</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <div class="meta-tags">
                                <div class="meta-tag">⏱️ ${video.duration}</div>
                                <div class="meta-tag">💾 ${formatBytes(video.size_bytes)}</div>
                                <div class="meta-tag">👁️ ${video.views}</div>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-copy" onclick="copyLink('${videoUrl}', this)">Copy</button>
                                <button class="btn btn-view" onclick="openVideoModal('${videoUrl}', this)">View</button>
                                <a href="${videoUrl}" download="${video.filename}" class="btn btn-download" title="Download to Device" onclick="markViewed(this)">📥</a>
                                <button class="btn btn-delete" 
                                    onmouseover="this.closest('.card').classList.add('hover-delete')" 
                                    onmouseout="this.closest('.card').classList.remove('hover-delete')" 
                                    onclick="triggerDelete('${video.id}', this)" title="Delete Video">✖</button>
                            </div>
                        </div>
                    `;
                    grid.prepend(card);
                    newItemsAdded = true;
                }
            });

            if (newItemsAdded) {
                const loadingState = document.getElementById('loadingState');
                if (loadingState) loadingState.remove();
            }
        }

        function showProcessingTile() {
            const grid = document.getElementById('videoGrid');
            if (document.getElementById('loadingState')) return;
            const tile = document.createElement('div');
            tile.className = 'card';
            tile.id = 'loadingState';
            tile.style.borderLeftColor = '#ff8c00';
            tile.innerHTML = `
                <div class="card-content">
                    <div class="thumbnail-wrapper" style="border: 1px dashed #ff8c00; color: #ff8c00;"><div class="thumbnail">Downloading...</div></div>
                    <div class="card-header"><div class="video-title" style="color:#888;">Fetching metadata...</div></div>
                </div>
                <div class="card-bottom">
                    <div class="btn-group"><button class="btn" disabled style="background:#555; color:#888;">Working on it...</button></div>
                </div>
            `;
            grid.prepend(tile);
        }

        async function submitUrl(e) {
            e.preventDefault();
            const urlInput = document.getElementById('videoUrl');
            const formData = new FormData();
            formData.append('url', urlInput.value);
            
            if (window.pendingOverridePassword) {
                formData.append('override_password', window.pendingOverridePassword);
                window.pendingOverridePassword = null;
            }
            
            showProcessingTile();
            const response = await fetch('/api/download_form', { method: 'POST', body: formData });
            const result = await response.json();
            
            if (result.status === "needs_override") {
                document.getElementById('loadingState').remove();
                const pwd = prompt(`Warning: Video is ${result.size_mb}MB (Limit: ${window.MAX_DOWNLOAD_MB || 150}MB).\nEnter admin password to override:`);
                if (pwd) {
                    window.pendingOverridePassword = pwd;
                    submitUrl(e); 
                }
                return;
            }
            urlInput.value = '';
        }

        async function uploadFile(e) {
            e.preventDefault();
            const fileInput = document.getElementById('localFile');
            if (fileInput.files.length === 0) return;
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            showProcessingTile();
            await fetch('/api/upload', { method: 'POST', body: formData });
            fileInput.value = '';
        }

        function triggerDelete(videoId, btnElement) {
            const card = btnElement.closest('.card');
            card.classList.remove('viewed');
            card.classList.add('deleting');
            pendingDeleteId = videoId;
            pendingDeleteCard = card;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function cancelDelete() {
            if (pendingDeleteCard) {
                pendingDeleteCard.classList.remove('deleting');
                pendingDeleteCard.classList.remove('hover-delete');
                pendingDeleteCard.classList.add('viewed');
            }
            document.getElementById('deleteModal').style.display = 'none';
            pendingDeleteId = null;
            pendingDeleteCard = null;
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;
            try {
                const response = await fetch('/api/videos/' + pendingDeleteId, { method: 'DELETE' });
                if (response.ok && pendingDeleteCard) {
                    pendingDeleteCard.remove();
                } else {
                    cancelDelete();
                }
            } catch (err) { cancelDelete(); }
            document.getElementById('deleteModal').style.display = 'none';
        }

        function copyLink(url, btnElement) {
            markViewed(btnElement);
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(showToast).catch(fallbackCopyTextToClipboard.bind(null, url));
            } else { fallbackCopyTextToClipboard(url); }
        }

        function fallbackCopyTextToClipboard(text) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; document.body.appendChild(textArea);
            textArea.focus(); textArea.select();
            try { document.execCommand('copy'); showToast(); } catch (err) {}
            document.body.removeChild(textArea);
        }

        function markViewed(element) {
            const card = element.closest('.card');
            if (card && !card.classList.contains('deleting')) { card.classList.add('viewed'); }
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function openVideoModal(url, btnElement) {
            markViewed(btnElement);
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            video.src = url;
            modal.style.display = 'flex';
            video.play();
            if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
                if (video.requestFullscreen) { video.requestFullscreen(); }
                else if (video.webkitRequestFullscreen) { video.webkitRequestFullscreen(); }
            }
        }

        function closeVideoModal(e) {
            if (!e || e.target.id === 'videoModal' || e.target.className === 'close-modal') {
                const modal = document.getElementById('videoModal');
                const video = document.getElementById('modalVideo');
                video.pause();
                video.src = '';
                modal.style.display = 'none';
            }
        }

        async function openStats() {
            const response = await fetch('/api/stats');
            if (response.ok) {
                const stats = await response.json();
                window.MAX_DOWNLOAD_MB = stats.limit_mb;
                const content = document.getElementById('statsContent');
                content.innerHTML = `
                    <h3>Server Statistics</h3>
                    <p>Live Videos: <strong>${stats.video_count}</strong></p>
                    <p>Deleted Videos: <strong>${stats.deleted_count}</strong></p>
                    <p>Used Disk Space: <strong>${formatBytes(stats.used_disk)}</strong></p>
                    <p>Estimated Bandwidth Served: <strong>${formatBytes(stats.bandwidth)}</strong></p>
                `;
                document.getElementById('statsModal').style.display = 'flex';
            }
        }

        function closeStatsModal(e) {
            if (e.target.id === 'statsModal') {
                document.getElementById('statsModal').style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeVideoModal();
                if(document.getElementById('statsModal').style.display === 'flex') closeStatsModal({target: {id: 'statsModal'}});
                if(document.getElementById('deleteModal').style.display === 'flex') cancelDelete();
            }
        });

        setInterval(() => {
            if (document.getElementById('app-screen').style.display === 'block') {
                checkAuthAndLoad();
            }
        }, 3000);
        
        window.onload = checkAuthAndLoad;
    </script>
</body>
</html>
