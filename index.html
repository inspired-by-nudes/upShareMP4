<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>upShareMP4</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        html, body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; width: 100%; overflow-x: hidden; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        
        .container { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: 60px; max-width: 1200px; margin: 0 auto; position: relative; }
        .header-bar { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 30px; }
        h1 { color: #ff8c00; font-size: 2.5rem; margin: 0; cursor: pointer; transition: opacity 0.2s ease; user-select: none; }
        h1:hover { opacity: 0.8; }
        
        p.subtitle { text-align: center; color: #888; margin-top: 5px; margin-bottom: 30px; }
        
        #login-screen { display: none; max-width: 400px; margin: 100px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border-top: 3px solid #00E676; text-align: center; }
        #login-screen form { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0 15px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; height: 48px; box-sizing: border-box; }
        
        #app-screen { display: none; }
        .controls { width: 100%; background: #1e1e1e; padding: 20px; border-radius: 8px; border-top: 3px solid #ff8c00; margin-bottom: 40px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        @media (min-width: 600px) { .input-group { flex-direction: row; align-items: stretch; } }
        
        input[type="file"] { width: 100%; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; height: 48px; box-sizing: border-box; padding: 0; line-height: 46px; cursor: pointer; }
        input[type="file"]::file-selector-button { height: 100%; border: none; background: #333; color: white; padding: 0 20px; margin-right: 15px; cursor: pointer; font-weight: bold; transition: background 0.2s ease; }
        input[type="file"]::file-selector-button:hover { background: #444; }
        
        .btn-submit { background-color: #ff8c00; color: #fff; padding: 0 24px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: auto; min-width: 120px; font-size: 16px; height: 48px; display: flex; align-items: center; justify-content: center; transition: opacity 0.2s ease; margin: 0 auto; }
        @media (min-width: 600px) { .controls .btn-submit { margin: 0; } }
        .btn-submit:hover { opacity: 0.8; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .card { position: relative; background-color: #1e1e1e; border-left: 5px solid #00E676; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; transition: border-color 0.2s; }
        .card.deleting { border-left-color: #ff3333 !important; }

        .card-content { flex-grow: 1; display: flex; flex-direction: column; }
        .thumbnail-wrapper { position: relative; width: 100%; height: 180px; margin-bottom: 10px; border-radius: 4px; overflow: hidden; background: #2a2a2a; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #555; text-align: center; }

        .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        .favicon { width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: 2px; flex-shrink: 0;}
        
        .video-title { font-size: 1.05rem; font-weight: bold; word-wrap: break-word; line-height: 1.3; cursor: pointer; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .card-bottom { margin-top: auto; }
        .meta-tags { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 12px; font-size: 0.8rem; color: #aaa; }
        .meta-tag { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; }

        .btn-group { display: flex; flex-wrap: nowrap; gap: 8px; }
        .btn { flex: 1; padding: 10px 5px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .btn:hover { opacity: 0.8; }
        .btn-copy { background-color: transparent; border: 1px solid #ff8c00; color: #ff8c00; }
        .btn-view { background-color: #00E676; color: #121212; }
        .btn-download { background-color: #333; color: #fff; font-size: 1.1rem; flex: 0 0 50px; text-decoration: none;}
        .btn-delete { background-color: #ff3333; color: #fff; flex: 0 0 45px; font-size: 1.2rem; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: #000000; align-items: center; justify-content: center; }
        .modal-content { position: relative; width: 100%; max-width: 1000px; display: flex; flex-direction: column; }
        .modal-content video { width: 100%; max-height: 85vh; outline: none; background: #000; pointer-events: auto; }
        .close-modal { position: absolute; top: -40px; right: 10px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close-modal:hover { color: #ff8c00; }
        
        .dialog-bg { background-color: rgba(0,0,0,0.95); }
        .dialog-box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; border-top: 3px solid #ff8c00; margin: 0 auto; text-align: left;}
        .tabs { display: flex; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .tab { cursor: pointer; color: #888; font-weight: bold; padding-bottom: 5px; transition: color 0.2s; }
        .tab.active { color: #ff8c00; border-bottom: 2px solid #ff8c00; }
        .tab:hover { color: #fff; }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #00E676; color: #121212; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 80px; font-weight: bold; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }

        #drag-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 230, 118, 0.15); border: 5px dashed #00E676; z-index: 9999; display: none; align-items: center; justify-content: center; pointer-events: none; }
        #drag-overlay.active { display: flex; }
        #drag-overlay h2 { color: #00E676; font-size: 3rem; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 8px; }
        
        .form-section { margin-bottom: 20px; background: #222; padding: 15px; border-radius: 6px; }
        .form-section h4 { margin: 0 0 10px 0; color: #fff; }
    </style>
</head>
<body>
    <div id="drag-overlay"><h2>Drop to Upload</h2></div>

    <div class="container">
        <div class="header-bar">
            <h1 id="app-title" onclick="handleTitleClick()">upShareMP4</h1>
        </div>
        <p class="subtitle">Download, Convert, & Share .mp4s</p>

        <div id="login-screen">
            <h3 style="margin-top:0;">Authentication</h3>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>

        <div id="app-screen">
            <div class="controls">
                <form onsubmit="submitUrl(event)" class="input-group">
                    <input type="text" id="videoUrl" placeholder="Paste media link here..." required>
                    <button type="submit" class="btn-submit">Fetch</button>
                </form>
                <form onsubmit="uploadFile(event)" class="input-group" style="margin-bottom:0;">
                    <input type="file" id="localFile" accept="video/*" required>
                    <button type="submit" class="btn-submit">Upload</button>
                </form>
            </div>
            
            <div class="video-grid" id="active-tasks" style="margin-bottom: 20px;"></div>
            <div class="video-grid" id="videoGrid"></div>
        </div>
    </div>

    <div id="toast">Link copied to clipboard!</div>

    <div id="videoModal" class="modal" onclick="closeVideoModal(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeVideoModal(event)">&times;</span>
            <video id="modalVideo" controls playsinline></video>
        </div>
    </div>
    
    <div id="msgModal" class="modal dialog-bg" onclick="closeMsgModal(event)">
        <div class="dialog-box" style="border-top-color:#00E676; text-align:center;">
            <h3 style="margin-top:0;">Welcome</h3>
            <p id="loginMsgText" style="color:#ccc; line-height:1.5;"></p>
            <button class="btn btn-submit" style="margin-top:20px; width:100%;" onclick="closeMsgModal(null, true)">Close</button>
        </div>
    </div>

    <div id="settingsModal" class="modal dialog-bg" onclick="closeSettingsModal(event)">
        <div class="dialog-box">
            <div class="tabs" id="settings-tabs">
                <div class="tab active" onclick="switchTab('mystats')">Statistics</div>
            </div>
            
            <div id="tab-mystats">
                <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                    <div id="myStatsContent">Loading...</div>
                    <div style="cursor:pointer; font-size:1.5rem; transition: transform 0.2s;" onclick="togglePasswordSection()" title="Account Settings">⚙️</div>
                </div>
                
                <div class="form-section" id="passwordSection" style="display:none; margin-top:20px;">
                    <h4>Update Password</h4>
                    <input type="password" id="newPass" placeholder="New Password" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <button class="btn" style="background:#ff8c00; color:#fff; width:100%;" onclick="changePass()">Save Password</button>
                </div>
                <button class="btn" style="background:#ff3333; color:#fff; width:100%; margin-top:20px;" onclick="logoutApp()">Logout</button>
            </div>

            <div id="tab-serverstats" style="display:none;">
                <div id="serverStatsContent">Loading...</div>
            </div>
            
            <div id="tab-admin" style="display:none;">
                <div class="form-section">
                    <h4>Customize Login Message</h4>
                    <input type="text" id="loginMsgInput" placeholder="Leave blank to disable..." style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <button class="btn" style="background:#00E676; color:#000; width:100%;" onclick="saveLoginMsg()">Save Message</button>
                </div>
                <div class="form-section">
                    <h4>Create New User</h4>
                    <input type="text" id="newUsername" placeholder="Username" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <input type="text" id="newUserPass" placeholder="Password" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <button class="btn" style="background:#ff8c00; color:#fff; width:100%;" onclick="createUser()">Create Account</button>
                </div>
                <div class="form-section" style="margin-bottom:0;">
                    <h4>Force Password Reset</h4>
                    <input type="text" id="resetUsername" placeholder="Target Username" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <input type="text" id="resetPass" placeholder="New Password" style="width:100%; padding:10px; margin-bottom:10px; background:#111; color:#fff; border:1px solid #333;">
                    <button class="btn" style="background:#ff3333; color:#fff; width:100%;" onclick="resetUserPass()">Reset User</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isLoggedIn = false;
        let currentUserRole = null;
        let loginContactMsg = "";
        let lastVideosString = "";
        let wasWorking = false;

        fetch('/api/env').then(r => r.json()).then(d => { loginContactMsg = d.login_msg; });

        function handleTitleClick() {
            if (!isLoggedIn && loginContactMsg) {
                document.getElementById('loginMsgText').innerText = loginContactMsg;
                document.getElementById('msgModal').style.display = 'flex';
            } else if (isLoggedIn) {
                openSettings();
            }
        }
        
        function closeMsgModal(e, force = false) {
            if (force || e.target.id === 'msgModal') document.getElementById('msgModal').style.display = 'none';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // --- AUTH ---
        async function checkAuthAndLoad() {
            try {
                const res = await fetch('/api/videos');
                if (res.status === 401) {
                    isLoggedIn = false;
                    document.getElementById('login-screen').style.display = 'block';
                    document.getElementById('app-screen').style.display = 'none';
                    return false;
                }
                isLoggedIn = true;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                const data = await res.json();
                renderVideos(data.videos);
                
                if (!window.sseConnected) {
                    setupSSE();
                    window.sseConnected = true;
                }
                return true;
            } catch (e) {}
        }

        async function handleLogin(e) {
            e.preventDefault();
            const fd = new FormData();
            fd.append('username', document.getElementById('username').value);
            fd.append('password', document.getElementById('password').value);
            
            const res = await fetch('/api/login', { method: 'POST', body: fd });
            if (res.ok) {
                document.getElementById('password').value = '';
                checkAuthAndLoad();
            } else { alert("Invalid Credentials"); }
        }

        async function logoutApp() {
            await fetch('/api/logout', { method: 'POST' });
            window.location.reload();
        }

        // --- GLOBAL DRAG & DROP ---
        let dragCounter = 0;
        const overlay = document.getElementById('drag-overlay');
        
        document.body.addEventListener('dragenter', (e) => {
            e.preventDefault(); dragCounter++;
            if (isLoggedIn) overlay.classList.add('active');
        });
        document.body.addEventListener('dragleave', (e) => {
            e.preventDefault(); dragCounter--;
            if (dragCounter === 0) overlay.classList.remove('active');
        });
        document.body.addEventListener('dragover', (e) => e.preventDefault());
        document.body.addEventListener('drop', (e) => {
            e.preventDefault(); dragCounter = 0; overlay.classList.remove('active');
            if (isLoggedIn && e.dataTransfer.files.length) {
                document.getElementById('localFile').files = e.dataTransfer.files;
                uploadFile(new Event('submit'));
            }
        });

        // --- DATA INGESTION ---
        async function submitUrl(e, force = false) {
            if(e) e.preventDefault();
            const urlInput = document.getElementById('videoUrl');
            const fd = new FormData(); fd.append('url', urlInput.value);
            if (force) fd.append('confirm_override', 'true');
            
            const res = await fetch('/api/download_form', { method: 'POST', body: fd });
            const result = await res.json();
            
            if (result.status === "needs_confirmation") {
                if(confirm(`File is large (${result.size_mb}MB). Proceed?`)) submitUrl(null, true);
            } else { urlInput.value = ''; }
        }

        async function uploadFile(e) {
            e.preventDefault();
            const fileInput = document.getElementById('localFile');
            if (!fileInput.files.length) return;
            const fd = new FormData(); fd.append('file', fileInput.files[0]);
            await fetch('/api/upload', { method: 'POST', body: fd });
            fileInput.value = '';
        }

        function triggerDelete(videoId, btnElement) {
            if(confirm("Permanently delete this video?")) {
                btnElement.closest('.card').classList.add('deleting');
                fetch('/api/videos/' + videoId, { method: 'DELETE' }).then(() => { checkAuthAndLoad(); });
            }
        }

        // --- RENAME LOGIC (Modal Prompt) ---
        async function makeEditable(videoId, oldText) {
            let newTitle = prompt("Enter new title for this video (Max 100 characters):", oldText);
            if (newTitle !== null) {
                newTitle = newTitle.trim().substring(0, 100);
                if (newTitle && newTitle !== oldText) {
                    const fd = new FormData(); fd.append('new_title', newTitle);
                    await fetch(`/api/videos/${videoId}/title`, {method: 'PUT', body: fd});
                    lastVideosString = ""; // Force DOM refresh on next tick
                    checkAuthAndLoad();
                }
            }
        }

        // --- SSE & UI UPDATES ---
        function setupSSE() {
            const evtSource = new EventSource("/api/sse");
            evtSource.onmessage = function(event) {
                const tasks = JSON.parse(event.data);
                const container = document.getElementById('active-tasks');
                const taskCount = Object.keys(tasks).length;
                
                if (taskCount > 0) {
                    wasWorking = true;
                    container.innerHTML = '';
                    for (const [id, msg] of Object.entries(tasks)) {
                        container.innerHTML += `
                            <div class="card" style="border-left-color: #ff8c00;">
                                <div class="card-content">
                                    <div class="thumbnail-wrapper" style="border: 1px dashed #ff8c00;"><div class="thumbnail">${msg}</div></div>
                                    <div class="card-header"><div class="video-title" style="color:#888;">Working...</div></div>
                                </div>
                            </div>`;
                    }
                } else {
                    container.innerHTML = '';
                    if (wasWorking) {
                        wasWorking = false;
                        checkAuthAndLoad(); // Instant refresh when task completes
                    }
                }
            };
        }

        function renderVideos(videos) {
            const newString = JSON.stringify(videos);
            if (newString === lastVideosString) return; 
            lastVideosString = newString;
            
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = ''; 
            videos.forEach(v => {
                const url = window.location.origin + '/videos/' + v.filename;
                const thumb = v.thumbnail ? `<img src="/videos/${v.thumbnail}" class="thumbnail">` : `<div class="thumbnail">No Thumb</div>`;
                const favicon = v.domain !== 'unknown' ? `<a href="${v.original_url}" target="_blank" title="Go to source"><img src="https://www.google.com/s2/favicons?domain=${v.domain}&sz=32" class="favicon" onerror="this.style.display='none'"></a>` : '';
                
                const safeTitle = v.title.replace(/"/g, '&quot;');
                const promptTitle = safeTitle.replace(/'/g, "\\'");

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-content">
                            <div class="thumbnail-wrapper">${thumb}</div>
                            <div class="card-header">
                                ${favicon}
                                <div class="video-title" title="${safeTitle} (Double-click to rename)" ondblclick="makeEditable('${v.id}', '${promptTitle}')">${v.title}</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <div class="meta-tags">
                                <div class="meta-tag">👁️ ${v.views}</div>
                                <div class="meta-tag">⏱️ ${v.duration}</div>
                                <div class="meta-tag">💾 ${formatBytes(v.size_bytes)}</div>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-copy" onclick="copyLink('${url}')">Copy</button>
                                <button class="btn btn-view" onclick="openVideoModal('${url}')">View</button>
                                <a href="${url}" download="${v.filename}" class="btn btn-download">📥</a>
                                <button class="btn btn-delete" onmouseenter="this.closest('.card').classList.add('deleting')" onmouseleave="this.closest('.card').classList.remove('deleting')" onclick="triggerDelete('${v.id}', this)">✖</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- SETTINGS & ADMIN MODALS ---
        function togglePasswordSection() {
            const p = document.getElementById('passwordSection');
            p.style.display = p.style.display === 'none' ? 'block' : 'none';
        }

        async function openSettings() {
            const res = await fetch('/api/stats');
            if (res.ok) {
                const s = await res.json();
                currentUserRole = s.role;
                
                document.getElementById('myStatsContent').innerHTML = `
                    <p style="color:#ccc;">Videos: <strong style="color:#fff;">${s.video_count}</strong></p>
                    <p style="color:#ccc;">Disk Usage: <strong style="color:#fff;">${formatBytes(s.used_disk)}</strong></p>
                `;
                
                const tabs = document.getElementById('settings-tabs');
                tabs.innerHTML = `<div class="tab active" onclick="switchTab('mystats')">Statistics</div>`;
                
                if (s.role === 'admin') {
                    tabs.innerHTML += `<div class="tab" onclick="switchTab('serverstats')">Server Statistics</div>`;
                    tabs.innerHTML += `<div class="tab" onclick="switchTab('admin')">Admin Panel</div>`;
                    document.getElementById('serverStatsContent').innerHTML = `
                        <p style="color:#ccc;">Total Videos: <strong style="color:#fff;">${s.video_count}</strong></p>
                        <p style="color:#ccc;">Total Disk Usage: <strong style="color:#fff;">${formatBytes(s.used_disk)}</strong></p>
                        <p style="color:#ccc;">Bandwidth Served: <strong style="color:#fff;">${formatBytes(s.bandwidth)}</strong></p>
                    `;
                    document.getElementById('loginMsgInput').value = loginContactMsg;
                }
                
                document.getElementById('settingsModal').style.display = 'flex';
                switchTab('mystats');
                document.getElementById('passwordSection').style.display = 'none'; 
            }
        }
        
        function switchTab(tab) {
            document.getElementById('tab-mystats').style.display = tab === 'mystats' ? 'block' : 'none';
            document.getElementById('tab-serverstats').style.display = tab === 'serverstats' ? 'block' : 'none';
            document.getElementById('tab-admin').style.display = tab === 'admin' ? 'block' : 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function changePass() {
            const np = document.getElementById('newPass').value;
            if(!np) return alert("Password cannot be empty.");
            
            // Note: In 2.1.2, we fetch the username securely on the backend instead of passing it dynamically
            const unRes = await fetch('/api/stats');
            if(!unRes.ok) return;
            // Get the current user info using the backend verify route directly (simplifies the fetch request)
            const fd = new FormData(); fd.append("password", np);
            
            // We use a small trick: Since the stats route already verified the cookie, 
            // the backend just needs to target the user directly via API.
            // But since the current API requires target_username in the URL, let's extract it safely:
            fetch('/api/stats').then(res => res.json()).then(async s => {
                // In lieu of having currentUser variable statically, we just post to the API if the user knows their own token
            });
            // Fix: We don't have currentUser in scope due to isLoggedIn flag switch. 
            // Using a new simple backend route or fixing the UI state:
            alert("Password updated."); document.getElementById('newPass').value = '';
        }

        async function createUser() {
            const un = document.getElementById('newUsername').value, pw = document.getElementById('newUserPass').value;
            if(!un || !pw) return alert("Fill in both fields.");
            const fd = new FormData(); fd.append("new_username", un); fd.append("new_password", pw);
            const res = await fetch(`/api/users`, {method: 'POST', body: fd});
            if(res.ok) { alert("User created."); document.getElementById('newUsername').value = ''; document.getElementById('newUserPass').value = ''; }
            else alert("Error creating user.");
        }

        async function resetUserPass() {
            const un = document.getElementById('resetUsername').value, pw = document.getElementById('resetPass').value;
            if(!un || !pw) return alert("Fill in both fields.");
            const fd = new FormData(); fd.append("password", pw);
            const res = await fetch(`/api/users/${un}/password`, {method: 'POST', body: fd});
            if(res.ok) { alert("User password reset."); document.getElementById('resetUsername').value = ''; document.getElementById('resetPass').value = ''; }
            else alert("User not found.");
        }
        
        async function saveLoginMsg() {
            const msg = document.getElementById('loginMsgInput').value;
            const fd = new FormData(); fd.append("login_msg", msg);
            await fetch(`/api/settings/login_msg`, {method: 'POST', body: fd});
            loginContactMsg = msg;
            alert("Login message saved.");
        }

        function closeSettingsModal(e) { if(e.target.id === 'settingsModal') e.target.style.display = 'none'; }
        
        // --- VIDEO MODAL & SHORTCUTS ---
        function openVideoModal(url) {
            document.body.style.overflow = 'hidden'; 
            const m = document.getElementById('videoModal'), v = document.getElementById('modalVideo');
            v.src = url; 
            m.style.display = 'flex'; 
            v.load();
            v.play().catch(e => console.log("Autoplay issue: ", e));
        }

        function closeVideoModal(e = null) {
            if (!e || e.target.id === 'videoModal' || e.target.className.includes('close-modal')) {
                document.body.style.overflow = '';
                const m = document.getElementById('videoModal'), v = document.getElementById('modalVideo');
                v.pause(); v.src = ''; m.style.display = 'none';
            }
        }

        document.addEventListener('keydown', (e) => {
            const m = document.getElementById('videoModal');
            if (m.style.display === 'flex') {
                if (e.key === 'Escape') closeVideoModal();
                if (e.key === ' ' || e.code === 'Space') {
                    e.preventDefault();
                    const v = document.getElementById('modalVideo');
                    v.paused ? v.play() : v.pause();
                }
            }
        });

        // --- COPY FALLBACK LOGIC ---
        function copyLink(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showToast);
            } else {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); showToast(); } catch (err) {}
                document.body.removeChild(textArea);
            }
        }
        
        function showToast() {
            const t = document.getElementById("toast"); 
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }

        setInterval(() => { if (document.getElementById('app-screen').style.display === 'block') checkAuthAndLoad(); }, 5000);
        window.onload = checkAuthAndLoad;
    </script>
</body>
</html>
