<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>upShareMedia</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        html, body { background-color: #121212; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; width: 100%; overflow-x: hidden; box-sizing: border-box; }
        *, *:before, *:after { box-sizing: inherit; }
        body.modal-open { overflow: hidden !important; height: 100vh !important; touch-action: none; }

        .container { padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: 80px; max-width: 1200px; margin: 0 auto; position: relative; }
        .header-bar { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 5px; }
        h1 { color: #ff8c00; font-size: 2.5rem; margin: 0; cursor: pointer; transition: opacity 0.2s ease; user-select: none; }
        h1:hover { opacity: 0.8; }

        p.subtitle { text-align: center; color: #888; margin-top: 0px; margin-bottom: 25px; font-weight: 500; letter-spacing: 1px;}

        #login-screen { display: none; max-width: 400px; margin: 100px auto; background: #1e1e1e; padding: 30px; border-radius: 8px; border-top: 3px solid #00E676; text-align: center; }
        #login-screen form { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        #login-screen .btn-submit { width: 100%; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 0 15px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 16px; height: 48px; box-sizing: border-box; }

        #app-screen { display: none; }

        .segmented-control { display: flex; background: #1e1e1e; border-radius: 8px 8px 0 0; border: 1px solid #333; border-bottom: none; overflow: hidden; }
        .segment-btn { flex: 1; padding: 14px 10px; background: transparent; border: none; color: #888; font-weight: bold; cursor: pointer; font-size: 0.95rem; text-align: center; transition: all 0.2s ease; }
        .segment-btn.active { background: #ff8c00; color: #fff; }

        .controls { width: 100%; background: #1e1e1e; padding: 20px; border-radius: 0 0 8px 8px; border-top: 3px solid #ff8c00; margin-bottom: 30px; display: flex; flex-direction: column; gap: 15px; }

        .tab-content { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .form-row { display: flex; gap: 10px; width: 100%; }
        .form-row.options { justify-content: space-between; }
        .form-row input, .form-row select { height: 48px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; padding: 0 15px; }
        .form-row input { flex: 1; }

        input[type="file"] { padding: 0 !important; line-height: 46px; cursor: pointer; }
        input[type="file"]::file-selector-button { height: 100%; border: none; background: #333; color: white; padding: 0 15px; margin-right: 15px; cursor: pointer; font-weight: bold; }

        select.expire-drop { flex: 1; background: #222; border-color: #444; }

        .btn-submit { background-color: #ff8c00; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; height: 48px; padding: 0 24px; flex: 1; }
        .btn-submit:hover { opacity: 0.8; }

        @media (max-width: 600px) {
            .controls { padding: 15px; }
            select.expire-drop { font-size: 13px; padding: 0 5px; }
            .segment-btn { font-size: 0.85rem; padding: 12px 5px; }
        }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; width: 100%; }
        .card { position: relative; background-color: #1e1e1e; border-left: 5px solid #00E676; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; transition: border-color 0.2s; }
        .card.deleting { border-left-color: #ff3333 !important; }
        .card.working { border-left-color: #ff8c00 !important; }
        
        .card.article-card { border-left-color: #ffffff !important; }
        .card.carousel-card { border-left-color: #2196F3 !important; } 

        .card-checkbox { display: none; position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; z-index: 10; cursor: pointer; }
        .card:hover .card-checkbox, .card-checkbox:checked { display: block; }
        body.select-mode-active .btn-group a, body.select-mode-active .btn-group button { opacity: 0.3; pointer-events: none; }

        .card-content { flex-grow: 1; display: flex; flex-direction: column; }
        .thumbnail-wrapper { position: relative; width: 100%; height: 180px; margin-bottom: 10px; border-radius: 4px; overflow: hidden; background: #2a2a2a; }
        .thumbnail { width: 100%; height: 100%; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #555; text-align: center; font-weight:bold;}

        .date-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; }
        .expire-badge { position: absolute; top: 8px; left: 8px; background: rgba(255, 51, 51, 0.85); color: #fff; font-size: 0.7rem; padding: 3px 6px; border-radius: 4px; }

        .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        .favicon { width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: 2px; flex-shrink: 0;}
        .video-title { font-size: 1.05rem; font-weight: bold; word-wrap: break-word; line-height: 1.3; cursor: pointer; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .card-bottom { margin-top: auto; }
        .meta-tags { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 12px; font-size: 0.8rem; color: #aaa; }
        .meta-tag { background: #2a2a2a; padding: 4px 8px; border-radius: 4px; }

        .btn-group { display: flex; flex-wrap: nowrap; gap: 6px; }
        .btn { flex: 1; padding: 10px 2px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; transition: opacity 0.2s ease; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .btn:hover { opacity: 0.8; }
        .btn-copy { background-color: transparent; border: 1px solid #ff8c00; color: #ff8c00; }
        .btn-view { background-color: #00E676; color: #121212; }
        .btn-edit { background-color: #555; color: #fff; flex: 0 0 45px; }
        .btn-download { background-color: #444; color: #fff; flex: 0 0 45px; }
        .btn-delete { background-color: #ff3333; color: #fff; flex: 0 0 40px; }

        #bulk-action-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #ff3333; color: #fff; text-align: center; padding: 15px; z-index: 900; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); align-items: center; justify-content: center; overflow-y: auto; padding: 20px; box-sizing: border-box;}
        .dialog-box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; border-top: 3px solid #ff8c00; margin: auto; }
        .tabs-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .tabs { display: flex; gap: 15px; width: 100%; align-items: center; }
        .tab { cursor: pointer; color: #888; font-weight: bold; padding-bottom: 5px; opacity: 0.5; transition: all 0.2s ease; }
        .tab.active { color: #ff8c00; border-bottom: 2px solid #ff8c00; opacity: 1; }

        .tab-pane { min-height: 200px; display: none; }
        .tab-pane.active-pane { display: block; }

        .form-section { padding: 0 15px 15px 15px; margin-bottom: 10px; }
        .admin-group { background: #222; border-radius: 6px; margin-bottom: 10px; }
        .admin-group summary { padding: 15px; font-weight: bold; cursor: pointer; outline: none; list-style: none; color: #fff;}
        .admin-group summary::after { content: "+"; float: right; color: #ff8c00; }
        .admin-group[open] summary::after { content: "-"; }

        #editor-modal .dialog-box { max-width: 800px; }

        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; margin: 5px 0 15px 0;}
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: #333; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { height: 16px; width: 16px; border-radius: 50%; background: #ff8c00; cursor: pointer; -webkit-appearance: none; margin-top: -5px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #00E676; color: #121212; text-align: center; border-radius: 4px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 80px; font-weight: bold; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }

        #backToTop { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; border: none; outline: none; background-color: #ff8c00; color: white; cursor: pointer; width: 50px; height: 50px; padding: 0; border-radius: 50%; font-size: 20px; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: opacity 0.3s; align-items: center; justify-content: center; }
        #backToTop:hover { background-color: #e07b00; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 id="app-title" onclick="handleTitleClick()">upShareMedia</h1>
        </div>
        <p class="subtitle">Upload &rarr; Convert &rarr; Share</p>

        <div id="login-screen">
            <h3 style="margin-top:0;">Authentication</h3>
            <form onsubmit="handleLogin(event)">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit">Login ➔</button>
            </form>
        </div>

        <div id="app-screen">
            <div class="segmented-control">
                <button id="segFetchBtn" class="segment-btn active" onclick="switchSegment('fetch')">🔍 Fetch Link</button>
                <button id="segUploadBtn" class="segment-btn" onclick="switchSegment('upload')">⬆️ Upload File</button>
            </div>

            <div class="controls">
                <form id="fetchForm" onsubmit="submitUrl(event)" class="tab-content">
                    <div class="form-row">
                        <input type="text" id="videoUrl" placeholder="Paste link here..." required>
                    </div>
                    <div class="form-row options">
                        <select id="urlExpire" class="expire-drop">
                            <option value="0">Keep Forever</option>
                            <option value="1">Expire 24h</option>
                            <option value="7">Expire 7d</option>
                            <option value="30">Expire 30d</option>
                        </select>
                        <button type="submit" class="btn-submit">Fetch</button>
                    </div>
                </form>

                <form id="uploadForm" onsubmit="uploadFile(event)" class="tab-content" style="display:none;">
                    <div class="form-row">
                        <input type="file" id="localFile" accept="video/*" required>
                    </div>
                    <div class="form-row options">
                        <select id="fileExpire" class="expire-drop">
                            <option value="0">Keep Forever</option>
                            <option value="1">Expire 24h</option>
                        </select>
                        <button type="submit" class="btn-submit">Upload</button>
                    </div>
                </form>
            </div>

            <div class="video-grid" id="videoGrid"></div>
        </div>
    </div>

    <button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">↑</button>
    <div id="toast">copied to clipboard!</div>
    <div id="bulk-action-bar" onclick="processBulkDelete()">Delete Selected Items (0)</div>

    <!-- Interactive Editor Modal -->
    <div id="editor-modal" class="modal" onclick="closeEditorModal(event)">
        <div class="dialog-box">
            <h3 style="margin-top:0; border-bottom:1px solid #333; padding-bottom:10px;">Media Clipper</h3>
            <video id="editorVideo" controls playsinline style="width:100%; max-height:40vh; background:#000; border-radius: 4px;"></video>

            <div style="margin-top: 20px;">
                <label style="color:#aaa; font-size:0.85rem; display:flex; justify-content:space-between; font-weight:bold;"><span>Start Time:</span><span id="lblStart" style="color:#fff;">00:00:00</span></label>
                <input type="range" id="clipStart" min="0" value="0" step="0.1">

                <label style="color:#aaa; font-size:0.85rem; display:flex; justify-content:space-between; font-weight:bold;"><span>End Time:</span><span id="lblEnd" style="color:#fff;">00:00:00</span></label>
                <input type="range" id="clipEnd" min="0" value="0" step="0.1">

                <input type="hidden" id="editStart" value="00:00:00">
                <input type="hidden" id="editEnd" value="00:00:00">
            </div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="btn" style="background:#555; color:#fff;" onclick="submitEdit('copy')">Save as Copy</button>
                <button class="btn btn-submit" style="flex:1;" onclick="submitEdit('overwrite')">Overwrite Original</button>
            </div>
            <input type="hidden" id="editorVideoId">
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal" onclick="closeSettingsModal(event)">
        <div class="dialog-box">
            <div class="tabs-header">
                <div class="tabs" id="settings-tabs">
                    <!-- Tabs generated dynamically in openSettings() -->
                </div>
            </div>

            <div id="tab-mystats" class="tab-pane">
                <div id="myStatsContent">Loading...</div>
            </div>

            <div id="tab-account" class="tab-pane">
                <h4 style="margin-top:0; color:#fff;">Account Actions</h4>
                <input type="password" id="newPass" placeholder="New Password" style="width:100%; padding:10px; margin-bottom:10px; border-radius:4px; background:#111; color:#fff; border:1px solid #444;">
                <button class="btn" style="background:#ff8c00; color:#fff; width:100%; margin-bottom:10px;" onclick="changePass()">Save Password</button>
                <button class="btn" style="background:#ff3333; color:#fff; width:100%;" onclick="logoutApp()">Logout</button>
            </div>

            <div id="tab-serverstats" class="tab-pane"><div id="serverStatsContent">Loading...</div></div>
            <div id="tab-admin" class="tab-pane">
                <details class="admin-group">
                    <summary>Login Message</summary>
                    <div class="form-section">
                        <input type="text" id="loginMsgInput" placeholder="Leave blank to disable...">
                        <button class="btn" style="background:#00E676; color:#000; width:100%; margin-top:10px;" onclick="saveLoginMsg()">Save</button>
                    </div>
                </details>

                <details class="admin-group">
                    <summary>Create New Account</summary>
                    <div class="form-section">
                        <input type="text" id="newUsername" placeholder="New Username" style="margin-bottom:10px;">
                        <input type="text" id="newUserPass" placeholder="Password" style="margin-bottom:10px;">
                        <button class="btn" style="background:#ff8c00; color:#fff; width:100%;" onclick="createUser()">Create Account</button>
                    </div>
                </details>

                <details class="admin-group">
                    <summary>Force Password Reset</summary>
                    <div class="form-section">
                        <input type="text" id="resetUsername" placeholder="Target Username" style="margin-bottom:10px;">
                        <input type="text" id="resetPass" placeholder="New Password" style="margin-bottom:10px;">
                        <button class="btn" style="background:#ff3333; color:#fff; width:100%;" onclick="resetUserPass()">Force Reset</button>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <div id="msgModal" class="modal" onclick="closeMsgModal(event)">
        <div class="dialog-box" style="border-top-color:#00E676; text-align:center;">
            <h3 style="margin-top:0;">Welcome</h3>
            <p id="loginMsgText" style="color:#ccc; line-height:1.5;"></p>
            <button class="btn btn-submit" style="margin-top:20px; width:100%;" onclick="closeMsgModal(null, true)">Close</button>
        </div>
    </div>

    <script>
        let isLoggedIn = false, lastVideosString = "", currentTasks = {}, activeVideosData = [];
        let loginContactMsg = "";

        fetch('/api/env').then(r => r.json()).then(d => { loginContactMsg = d.login_msg; });

        function switchSegment(mode) {
            document.getElementById('segFetchBtn').className = mode === 'fetch' ? 'segment-btn active' : 'segment-btn';
            document.getElementById('segUploadBtn').className = mode === 'upload' ? 'segment-btn active' : 'segment-btn';
            document.getElementById('fetchForm').style.display = mode === 'fetch' ? 'flex' : 'none';
            document.getElementById('uploadForm').style.display = mode === 'upload' ? 'flex' : 'none';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getExpirationString(expiresAt) {
            const now = Date.now() / 1000;
            const diff = expiresAt - now;
            if (diff <= 0) return "Expired";
            const days = Math.floor(diff / 86400);
            const hours = Math.floor((diff % 86400) / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            if (days > 0) return `Expires in ${days}d ${hours}h`;
            if (hours > 0) return `Expires in ${hours}h ${minutes}m`;
            return `Expires in ${minutes}m`;
        }

        setInterval(() => {
            document.querySelectorAll('.countdown-badge').forEach(badge => {
                const exp = parseFloat(badge.getAttribute('data-expires'));
                badge.innerText = getExpirationString(exp);
            });
        }, 60000);

        function handleTitleClick() {
            if (!isLoggedIn && loginContactMsg) {
                document.getElementById('loginMsgText').innerText = loginContactMsg;
                document.getElementById('msgModal').style.display = 'flex';
                document.body.classList.add('modal-open');
            } else if (isLoggedIn) {
                openSettings();
            }
        }

        function closeMsgModal(e, force = false) {
            if (force || e.target.id === 'msgModal') {
                document.getElementById('msgModal').style.display = 'none';
                document.body.classList.remove('modal-open');
            }
        }

        async function checkAuthAndLoad() {
            try {
                const res = await fetch('/api/videos');
                if (res.status === 401) {
                    isLoggedIn = false;
                    document.getElementById('login-screen').style.display = 'block';
                    document.getElementById('app-screen').style.display = 'none';
                    return false;
                }
                isLoggedIn = true;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                const data = await res.json();
                activeVideosData = data.videos;
                renderUnifiedGrid();
                if (!window.sseConnected) { setupSSE(); window.sseConnected = true; }
                return true;
            } catch (e) {}
        }

        async function handleLogin(e) {
            e.preventDefault();
            const fd = new FormData(); fd.append('username', document.getElementById('username').value); fd.append('password', document.getElementById('password').value);
            const res = await fetch('/api/login', { method: 'POST', body: fd });
            if (res.ok) { document.getElementById('password').value = ''; checkAuthAndLoad(); } else alert("Invalid Credentials");
        }

        async function logoutApp() { await fetch('/api/logout', { method: 'POST' }); window.location.reload(); }

        async function submitUrl(e, force = false) {
            if(e) e.preventDefault();
            const ui = document.getElementById('videoUrl'), exp = document.getElementById('urlExpire').value;
            if (!ui.value.trim()) return;
            const tempTaskId = "temp_" + Date.now();
            currentTasks[tempTaskId] = "Starting up..."; renderUnifiedGrid();
            const fd = new FormData(); fd.append('url', ui.value); fd.append('expire_days', exp);
            if (force) fd.append('confirm_override', 'true');
            const res = await fetch('/api/download_form', { method: 'POST', body: fd });
            const result = await res.json();
            if (result.status === "needs_confirmation") {
                delete currentTasks[tempTaskId]; renderUnifiedGrid();
                if(confirm(`Large file (${result.size_mb}MB). Proceed?`)) submitUrl(null, true);
            } else { ui.value = ''; }
        }

        async function uploadFile(e) {
            e.preventDefault();
            const fi = document.getElementById('localFile'), exp = document.getElementById('fileExpire').value;
            if (!fi.files.length) return;
            currentTasks["temp_up_" + Date.now()] = "Uploading..."; renderUnifiedGrid();
            const fd = new FormData(); fd.append('file', fi.files[0]); fd.append('expire_days', exp);
            await fetch('/api/upload', { method: 'POST', body: fd }); fi.value = '';
        }

        function triggerDelete(videoId, btnElement) {
            if(confirm("Permanently delete?")) {
                btnElement.closest('.card').classList.add('deleting');
                fetch('/api/videos/' + videoId, { method: 'DELETE' }).then(() => checkAuthAndLoad());
            }
        }

        async function makeEditable(videoId, oldText) {
            let nt = prompt("Enter new title (Max 100 char):", oldText);
            if (nt !== null) {
                nt = nt.trim().substring(0, 100);
                if (nt && nt !== oldText) {
                    const fd = new FormData(); fd.append('new_title', nt);
                    await fetch(`/api/videos/${videoId}/title`, {method: 'PUT', body: fd});
                    lastVideosString = ""; checkAuthAndLoad();
                }
            }
        }

        function setupSSE() {
            const evtSource = new EventSource("/api/sse");
            evtSource.onmessage = function(event) {
                currentTasks = JSON.parse(event.data);
                if (Object.keys(currentTasks).length === 0) checkAuthAndLoad();
                else renderUnifiedGrid();
            };
        }

        function updateBulkCounter() {
            const c = document.querySelectorAll('.card-checkbox:checked').length;
            const b = document.getElementById('bulk-action-bar');

            if (c > 0) {
                b.style.display = 'block';
                document.body.classList.add('select-mode-active');
            } else {
                b.style.display = 'none';
                document.body.classList.remove('select-mode-active');
            }
            b.innerText = `Delete Selected Items (${c})`;
        }

        async function processBulkDelete() {
            const boxes = document.querySelectorAll('.card-checkbox:checked');
            if(boxes.length === 0 || !confirm(`Delete ${boxes.length} items?`)) return;
            const ids = Array.from(boxes).map(cb => cb.value);
            const fd = new FormData(); fd.append("video_ids", JSON.stringify(ids));
            await fetch('/api/videos/bulk_delete', { method: 'POST', body: fd });
            checkAuthAndLoad();
            updateBulkCounter();
        }

        function renderUnifiedGrid() {
            const stateString = JSON.stringify(currentTasks) + JSON.stringify(activeVideosData);
            if (stateString === lastVideosString) return; lastVideosString = stateString;
            const grid = document.getElementById('videoGrid');
            let htmlBuffer = "";
            
            for (const [id, msg] of Object.entries(currentTasks)) {
                htmlBuffer += `<div class="card working"><div class="card-content"><div class="thumbnail-wrapper"><div class="thumbnail">${msg}</div></div><div class="card-header"><div class="video-title">Working...</div></div></div></div>`;
            }
            
            activeVideosData.forEach(v => {
                const url = window.location.origin + '/videos/' + v.filename;
                
                const isCarousel = v.engine === '🎠 Carousel';
                const isArticle = v.type === 'article' && !isCarousel;
                const isImage = v.type === 'image';
                
                let cardClass = 'card';
                if (isArticle) cardClass += ' article-card';
                if (isCarousel) cardClass += ' carousel-card';

                const thumb = v.thumbnail ? `<img src="/videos/${v.thumbnail}" class="thumbnail">` : `<div class="thumbnail" style="font-size:1.5rem;">${isArticle ? '📝<br>Article' : (isCarousel ? '🎠<br>Carousel' : (isImage ? '🖼️<br>Image' : 'No Thumb'))}</div>`;
                const favicon = v.domain !== 'unknown' ? `<a href="${v.original_url}" target="_blank"><img src="https://www.google.com/s2/favicons?domain=${v.domain}&sz=32" class="favicon" onerror="this.style.display='none'"></a>` : '';
                const safeTitle = v.title.replace(/"/g, '&quot;');
                const promptTitle = safeTitle.replace(/'/g, "\\'");

                let expBadge = v.expires_at > 0 ? `<div class="expire-badge countdown-badge" data-expires="${v.expires_at}">${getExpirationString(v.expires_at)}</div>` : '';
                let editBtn = (!isArticle && !isCarousel && !isImage) ? `<button class="btn btn-edit" onclick="openEditorModal('${v.id}', '${url}')">✂️</button>` : '';
                let timeDisplay = (isArticle || isCarousel || isImage) ? (v.engine || (isImage ? '🖼️ Direct' : '📄 Readability')) : `⏱️ ${v.duration}`;

                htmlBuffer += `
                    <div class="${cardClass}">
                        <input type="checkbox" class="card-checkbox" value="${v.id}" onchange="updateBulkCounter()">
                        <div class="card-content">
                            <div class="thumbnail-wrapper">${thumb}${expBadge}<div class="date-badge">${v.date_badge}</div></div>
                            <div class="card-header">${favicon}<div class="video-title" title="${safeTitle}" ondblclick="makeEditable('${v.id}', '${promptTitle}')">${safeTitle}</div></div>
                        </div>
                        <div class="card-bottom">
                            <div class="meta-tags"><div class="meta-tag">👁️ ${v.views}</div><div class="meta-tag">${timeDisplay}</div><div class="meta-tag">💾 ${formatBytes(v.size_bytes)}</div></div>
                            <div class="btn-group">
                                <button class="btn btn-copy" onclick="copyLink('${url}')">Copy</button>
                                <a href="${url}" target="_blank" class="btn btn-view">View</a>
                                ${editBtn}
                                <a href="/api/download/${v.id}" class="btn btn-download">📥</a>
                                <button class="btn btn-delete" onmouseenter="this.closest('.card').classList.add('deleting')" onmouseleave="this.closest('.card').classList.remove('deleting')" onclick="triggerDelete('${v.id}', this)">✖</button>
                            </div>
                        </div>
                    </div>`;
            });
            grid.innerHTML = htmlBuffer;
            updateBulkCounter();
        }

        // --- EDITOR MODAL ---
        const vPlayer = document.getElementById('editorVideo');
        const sStart = document.getElementById('clipStart');
        const sEnd = document.getElementById('clipEnd');
        const tStart = document.getElementById('editStart');
        const tEnd = document.getElementById('editEnd');

        vPlayer.onloadedmetadata = () => {
            const dur = vPlayer.duration;
            sStart.max = dur; sEnd.max = dur;
            sStart.value = 0; sEnd.value = dur;
            updateTimeLabels();
        };

        sStart.oninput = () => {
            if (parseFloat(sStart.value) >= parseFloat(sEnd.value)) sEnd.value = parseFloat(sStart.value) + 0.1;
            vPlayer.currentTime = sStart.value;
            updateTimeLabels();
        };

        sEnd.oninput = () => {
            if (parseFloat(sEnd.value) <= parseFloat(sStart.value)) sStart.value = parseFloat(sEnd.value) - 0.1;
            vPlayer.currentTime = sEnd.value;
            updateTimeLabels();
        };

        function formatTime(sec) { return new Date(sec * 1000).toISOString().substring(11, 19); }

        function updateTimeLabels() {
            document.getElementById('lblStart').innerText = formatTime(sStart.value);
            document.getElementById('lblEnd').innerText = formatTime(sEnd.value);
            tStart.value = formatTime(sStart.value);
            tEnd.value = formatTime(sEnd.value);
        }

        function openEditorModal(id, url) {
            document.body.classList.add('modal-open');
            document.getElementById('editorVideoId').value = id;
            vPlayer.src = url;
            document.getElementById('editor-modal').style.display = 'flex';
        }

        function closeEditorModal(e) {
            if(e.target.id === 'editor-modal') {
                document.body.classList.remove('modal-open');
                vPlayer.pause();
                document.getElementById('editor-modal').style.display = 'none';
            }
        }

        async function submitEdit(mode) {
            const id = document.getElementById('editorVideoId').value;
            const fd = new FormData(); fd.append('start', tStart.value); fd.append('end', tEnd.value); fd.append('mode', mode);
            await fetch(`/api/edit/${id}`, {method:'POST', body: fd});
            document.getElementById('editor-modal').style.display = 'none';
            document.body.classList.remove('modal-open');
            currentTasks["temp_edit"] = "Clipping Media..."; renderUnifiedGrid();
        }

        // --- SETTINGS MODAL ---
        async function openSettings() {
            const res = await fetch('/api/stats');
            if (res.ok) {
                const s = await res.json();
                document.getElementById('myStatsContent').innerHTML = `<p style="color:#ccc;">Media Count: <strong style="color:#fff;">${s.video_count}</strong></p><p style="color:#ccc;">Disk Usage: <strong style="color:#fff;">${formatBytes(s.used_disk)}</strong></p><p style="color:#ccc;">Your Bandwidth: <strong style="color:#fff;">${formatBytes(s.user_bandwidth)}</strong></p>`;

                let tabsHtml = `<div class="tab active" onclick="switchTab('mystats', this)">Statistics</div>`;
                if (s.role === 'admin') {
                    tabsHtml += `<div class="tab" onclick="switchTab('serverstats', this)">Server</div><div class="tab" onclick="switchTab('admin', this)">Admin</div>`;
                    document.getElementById('serverStatsContent').innerHTML = `<p style="color:#ccc;">Total Media: <strong style="color:#fff;">${s.video_count}</strong></p><p style="color:#ccc;">Total Disk: <strong style="color:#fff;">${formatBytes(s.used_disk)}</strong></p><p style="color:#ccc;">Global Bandwidth: <strong style="color:#fff;">${formatBytes(s.bandwidth)}</strong></p>`;
                }
                tabsHtml += `<div style="flex:1;"></div><div class="tab" onclick="switchTab('account', this)" style="border-bottom:none; font-size:1.25rem;" title="Account Settings">⚙️</div>`;

                document.getElementById('settings-tabs').innerHTML = tabsHtml;
                document.getElementById('settingsModal').style.display = 'flex';
                document.body.classList.add('modal-open'); 
                switchTab('mystats');
            }
        }

        function closeSettingsModal(e) { if(e.target.id === 'settingsModal') { e.target.style.display = 'none'; document.body.classList.remove('modal-open'); } }

        function switchTab(tab, el = null) {
            ['mystats','account','serverstats','admin'].forEach(t => { 
                const container = document.getElementById('tab-'+t); 
                if(container) container.classList[t===tab ? 'add' : 'remove']('active-pane'); 
            });
            document.querySelectorAll('#settings-tabs .tab').forEach(t => t.classList.remove('active')); 

            if (el) {
                el.classList.add('active');
            } else {
                const firstTab = document.querySelector('#settings-tabs .tab');
                if(firstTab) firstTab.classList.add('active');
            }
        }

        async function changePass() { const np = document.getElementById('newPass').value; if(np){ const fd = new FormData(); fd.append("password", np); await fetch('/api/stats'); alert("Password updated."); document.getElementById('newPass').value = ''; } }
        async function createUser() { const un = document.getElementById('newUsername').value, pw = document.getElementById('newUserPass').value; if(un&&pw){ const fd = new FormData(); fd.append("new_username", un); fd.append("new_password", pw); const r = await fetch(`/api/users`, {method:'POST', body:fd}); if(r.ok) alert("Created."); else alert("Error.");} }
        async function resetUserPass() { const un = document.getElementById('resetUsername').value, pw = document.getElementById('resetPass').value; if(un&&pw){ const fd = new FormData(); fd.append("password", pw); const r = await fetch(`/api/users/${un}/password`, {method:'POST', body:fd}); if(r.ok) alert("Reset."); else alert("Not found.");} }

        function copyLink(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { 
                document.execCommand('copy'); 
                const t = document.getElementById("toast"); 
                t.className = "show"; 
                setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000); 
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        window.onscroll = function() {
            const btn = document.getElementById("backToTop");
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                btn.style.display = "flex";
            } else {
                btn.style.display = "none";
            }
        };

        setInterval(() => { if (document.getElementById('app-screen').style.display === 'block') checkAuthAndLoad(); }, 5000);
        window.onload = checkAuthAndLoad;
    </script>
</body>
</html>
